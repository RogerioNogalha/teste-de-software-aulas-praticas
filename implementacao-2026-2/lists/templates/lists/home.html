<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TODO Quality Lab</title>
  </head>
  <body>
    <main>
      <h1>Lista de tarefas</h1>
      <form method="post">
        {% csrf_token %}
        <label for="id_new_item">Nova tarefa</label>
        <input id="id_new_item" name="item_text" maxlength="200" required>
        <button type="submit">Adicionar</button>
      </form>
      {% if error %}<p role="alert">{{ error }}</p>{% endif %}
      <ol id="id_list_table">
        {% for item in items %}<li>{{ item.text }}</li>{% empty %}<li>Nenhuma tarefa.</li>{% endfor %}
      </ol>
    </main>
  </body>
</html>
